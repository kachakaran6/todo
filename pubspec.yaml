name: orbit_todo
description: "TaskMitra — A production-quality, offline-first to-do app. Simple by default. Deep by choice."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Navigation
  go_router: ^15.1.2

  # Preferences
  shared_preferences: ^2.3.5

  # Internalization & Dates
  intl: ^0.20.2

  # Fonts & Icons
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Animations
  flutter_animate: ^4.5.2

  # Utilities
  uuid: ^4.5.1
  equatable: ^2.0.7
  home_widget: ^0.7.0
  crypto: ^3.0.6
  in_app_update: ^4.2.3
  in_app_review: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.1

  # Linting
  flutter_lints: ^6.0.0
  custom_lint: ^0.7.5
  # Launcher icons
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "icon.png"
    background_color: "#121212"
    theme_color: "#3B82F6"
  windows:
    generate: true
    image_path: "icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "icon.png"

flutter:
  uses-material-design: true

